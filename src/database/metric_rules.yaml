# Metric rules for the `seatac` database.
# One entry per metric: the definition the chatbot shows users, the view that computes it,
# the groupings it may use, and known limits. Definitions confirmed by Samer (Port of Seattle).
# Views live in sql/seatac_views.sql. Every view has `exclusion_reason` (NULL = used) and `included`.
version: 1
database: seatac
timezone: "Local time at SEA (PDT). Times are never shifted."
data_scope: "One operating day at SEA: 2025-08-08 (from the Port's August 8-9 2025 export)."

# Which metric answers each of the Port's 10 questions (Gate Query User Story, "Final 10 Questions").
questions:
  Q1:  {title: "Taxi-In Performance (by aircraft type)", metrics: [taxi_in], group_by: aircraft_type}
  Q2:  {title: "Taxi-Out Performance (by hour of day)", metrics: [taxi_out], group_by: off_block_hour}
  Q3:  {title: "Movement Area Occupancy", metrics: [movement_area_peak, movement_area_time]}
  Q4:  {title: "Runway Occupancy Time", metrics: [runway_occupancy]}
  Q5:  {title: "Wheels-Up Delay Tracker", metrics: [takeoff_delay]}
  Q6:  {title: "Weight Class Comparison (taxi duration)", metrics: [taxi_in, taxi_out], group_by: weight_class_icao}
  Q7:  {title: "Taxiway Utilization", metrics: [taxiway_usage]}
  Q8:  {title: "Landing - In-Block Duration", metrics: [taxi_in]}
  Q9:  {title: "Runway Utilization Rate", metrics: [runway_utilization]}
  Q10: {title: "Peak Hour Prediction (history only)", metrics: [peak_hours]}

common_rules:
  - "Only rows with included = 1 (exclusion_reason IS NULL) go into averages, counts and charts."
  - "Report how many rows were excluded and why (exclusion_reason) alongside every answer."
  - "Durations are end minus start. 'negative duration' rows are excluded, except take-off delay where negative = early."
  - "A flight leg is identified by flight_info_id + operation. Count legs with COUNT(*) or COUNT(DISTINCT flight_info_id, operation)."

metrics:
  taxi_in:
    questions: [Q1, Q6, Q8]
    definition: "Taxi-in time is the time from wheels down (touchdown) to actual in-block (parked at the gate), for arrivals at SEA, in minutes."
    view: v_taxi_in
    value_column: duration_min
    allowed_groupings: [aircraft_type, weight_class_icao, carrier, runway, gate]
    known_limits:
      - "Weight classes in this data are only M (medium) and H (heavy); there are no light aircraft."
      - "Q8 (landing to in-block) uses the same definition as taxi-in."

  taxi_out:
    questions: [Q2, Q6]
    definition: "Taxi-out time is the time from actual off-block (pushback from the gate) to wheels up (take-off), for departures from SEA, in minutes."
    view: v_taxi_out
    value_column: duration_min
    allowed_groupings: [off_block_hour, off_block_date, aircraft_type, weight_class_icao, carrier, runway, gate]
    source: "Off-block time is Aerobahn's Actual Off Block Time (confirmed by the Port)."
    known_limits:
      - "Hour of day is the local hour of actual off-block."
      - "The export's own Actual Taxi Out Time uses AODB off-block, so it differs from this metric by design."
      - "Weight classes in this data are only M (medium) and H (heavy)."

  movement_area_time:
    questions: [Q3]
    definition: "Time in the movement area: for arrivals, wheels down to movement-area exit. For departures, movement-area entrance to wheels up."
    view: v_movement_area
    value_column: duration_min
    allowed_groupings: [operation, runway, aircraft_type, weight_class_icao]
    known_limits:
      - "PENDING PORT CONFIRMATION: the movement-area boundary (whether runway time counts as movement-area time)."

  movement_area_peak:
    questions: [Q3]
    definition: "The maximum number of aircraft in the movement area at the same time, for each local hour."
    view: v_movement_area_hourly_peak
    value_column: max_aircraft_in_area
    allowed_groupings: [local_date, local_hour]
    known_limits:
      - "PENDING PORT CONFIRMATION: same movement-area boundary as movement_area_time."
      - "Aircraft with a missing or negative interval are not counted."

  runway_occupancy:
    questions: [Q4]
    definition: "Runway occupancy is the time an aircraft is on the runway: for arrivals, wheels down to runway exit. For departures, runway entrance to wheels up. In seconds."
    view: v_runway_occupancy
    value_column: duration_sec
    allowed_groupings: [runway, operation, aircraft_type, weight_class_icao]
    known_limits:
      - "Arrivals and departures are measured from different events, so report them separately or say they are combined."

  takeoff_delay:
    questions: [Q5]
    definition: "Take-off delay is wheels up minus the scheduled take-off time, for departures, in minutes. Negative means the flight took off early."
    view: v_takeoff_delay
    value_column: delay_min
    allowed_groupings: [carrier, runway, aircraft_type, weight_class_icao]
    known_limits:
      - "No lateness threshold is applied. Early take-offs (negative values) are kept."

  taxiway_usage:
    questions: [Q7]
    definition: "Taxiway usage is the number of distinct flight legs that used each taxiway (e.g. Bravo) or each taxiway section (e.g. Bravo segment 28) to enter or exit the runway or the ramp."
    view: v_taxiway_usage
    value_column: "COUNT(DISTINCT flight_info_id, operation)"
    allowed_groupings: [taxiway_name, taxiway_letter, taxiway_segment, segment_number, segment_role, operation, runway]
    segment_codes: "Phonetic alphabet (confirmed by the Port): TaxiwaySegment_B_28 = taxiway Bravo (B), segment 28. By taxiway: group by taxiway_name. By section: group by taxiway_segment."
    taxiway_letters: {A: Alpha, B: Bravo, C: Charlie, D: Delta, E: Echo, F: Foxtrot, G: Golf, J: Juliet, K: Kilo, L: Lima, M: Mike, N: November, P: Papa, Q: Quebec, Z: Zulu}
    known_limits:
      - "Tango, Hotel and Whiskey do not appear in this data: the export only records the segment used to enter/exit the runway and the ramp, not the full taxi route. Say so if a user asks about them."
      - "Each leg records at most one runway-side and one ramp-side segment."
      - "TaxiwaySegment_B_SSR is on Bravo but has no segment number (segment_number is NULL); its meaning is not yet confirmed."
      - "Missed approaches are not included."

  runway_utilization:
    questions: [Q9]
    definition: "Runway utilization is the number of SEA take-offs (departures, wheels up) and landings (arrivals, wheels down) on each runway."
    view: v_runway_activity
    value_column: "COUNT(*)"
    allowed_groupings: [runway, activity, local_hour, local_date]
    known_limits:
      - "Missed approaches are flagged (is_missed_approach = 1) and excluded from take-off and landing counts by default."

  peak_hours:
    questions: [Q10]
    definition: "Peak hours are the local hours with the most SEA take-offs and landings."
    view: v_runway_activity
    value_column: "COUNT(*)"
    allowed_groupings: [local_hour, activity, runway]
    known_limits:
      - "HISTORY ONLY: one day of data. The system can describe past peaks but cannot predict future congestion."
